name: Build Nova AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Scaffolding
        run: |
          flutter create --project-name nova_ai --platforms=android --org com.example .

      - name: Configure Kotlin and Android SDK Versions
        run: |
          # 1. Root build.gradle me Kotlin version 1.9.20 set karein
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = '\''1.9.20'\''/g' android/build.gradle

          # 2. compileSdkVersion aur targetSdkVersion 34 set karein
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nova-AI-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
