name: Build Nova AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Scaffolding
        run: |
          flutter create --project-name nova_ai --platforms=android --org com.example .

      - name: Configure Repositories and Fix Plugin Gradle
        run: |
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  maven { url "https://repo1.maven.org/maven2" }
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 34
                          defaultConfig {
                              minSdkVersion 21
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nova-AI-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
